<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Mister Fritz Admin{% endblock %}</title>
    <style>
        :root {
            --fg: #1f2933;
            --muted: #738291;
            --bg: #f7f7f5;
            --card: #ffffff;
            --accent: #5b3f30;
            --border: #e2e1dc;
            --danger: #b3261e;
        }
        * { box-sizing: border-box; }
        body {
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            background: var(--bg); color: var(--fg);
            margin: 0; padding: 0; line-height: 1.5;
        }
        header {
            background: var(--accent); color: #fff;
            padding: 1rem 2rem; display: flex; align-items: baseline; gap: 2rem;
        }
        header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
        header nav a {
            color: rgba(255,255,255,0.85); text-decoration: none;
            margin-right: 1.25rem; font-size: 0.9rem;
        }
        header nav a:hover { color: #fff; text-decoration: underline; }
        main { padding: 2rem; max-width: 1100px; margin: 0 auto; }
        h2 { margin-top: 2rem; font-size: 1.1rem; color: var(--muted); font-weight: 500; }
        h2:first-child { margin-top: 0; }
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 6px; padding: 1.25rem; margin-bottom: 1rem;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td {
            text-align: left; padding: 0.5rem 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--muted); font-weight: 600; }
        tr:last-child td { border-bottom: none; }
        code, pre {
            background: #ecebe5; padding: 0.1rem 0.35rem; border-radius: 3px;
            font-size: 0.85rem;
        }
        pre { padding: 0.75rem; overflow-x: auto; }
        .muted { color: var(--muted); }
        .pill {
            display: inline-block; padding: 0.05rem 0.5rem; border-radius: 10px;
            background: #ecebe5; font-size: 0.8rem; color: var(--muted);
        }
        a { color: var(--accent); }
        button {
            font-family: inherit; font-size: 0.85rem;
            padding: 0.25rem 0.6rem; border-radius: 3px;
            border: 1px solid var(--border); background: #ecebe5;
            color: var(--fg); cursor: pointer;
        }
        button:hover { background: #e0dfd9; }
        button.danger {
            border-color: var(--danger); color: var(--danger); background: #fff;
        }
        button.danger:hover { background: var(--danger); color: #fff; }
        form.inline { display: inline; margin: 0; }

        /* Mobile. The panel was desktop-only: fixed 2rem gutters and tables
           that force a horizontal body scroll on a phone. */
        @media (max-width: 700px) {
            header {
                padding: 0.75rem 1rem; flex-direction: column;
                align-items: flex-start; gap: 0.5rem;
            }
            header nav a { margin-right: 0.9rem; }
            main { padding: 1rem; }
            .card { padding: 0.9rem; }
            /* Wide tables scroll inside their own box rather than the page. */
            table { display: block; overflow-x: auto; white-space: nowrap; }
        }

        /* Respect the OS "reduce motion" setting. Anything decorative that
           moves must stop; nothing here conveys state by motion alone. */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Mister Fritz · admin</h1>
        <nav>
            <a href="/">Overview</a>
            <a href="/users">Users</a>
            <a href="/schedules">Schedules</a>
            <a href="/documents">Documents</a>
            <a href="/chat">Chat</a>
            <a href="/health">Health JSON</a>
        </nav>
    </header>
    <main>
        {% block body %}{% endblock %}
    </main>
</body>
</html>
