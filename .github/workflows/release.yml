name: Release — Build & Canary Deploy

on:
  push:
    tags:
      - "v*"          # trigger on semver tags: v1.2.3

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Actions are pinned to commit SHAs, with the version they were resolved from
# in the comment. A tag like `v4` is a moving pointer: whoever controls the
# action's repository can re-point it, and this workflow would run whatever it
# pointed at next — with the token below, and in release.yml with credentials.
# The cost is that these do not update themselves; bump them deliberately, or
# let a dependency bot propose it.
jobs:
  # ── 1. Build and push image ────────────────────────────────────────────────
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # A digest, lowercased, single-line. The old value was
      # steps.meta.outputs.tags, which is a NEWLINE-SEPARATED LIST of four
      # tags — unusable in a shell command, and nothing read it anyway.
      image: ${{ steps.reference.outputs.image }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      # Without this step buildx uses its default `docker` driver — the
      # BuildKit built into dockerd — and that driver reports
      # CacheExport=false unless the containerd image store is enabled, which
      # on a GitHub runner it is not. buildx checks `cache-to` against the
      # driver's features while it assembles the solve options, BEFORE it reads
      # the Dockerfile, so the `cache-to` below aborted the build in one to
      # three seconds. That is why every tagged release since v0.2.0 failed,
      # and why no image has ever been pushed: four runs, four failures, each
      # with the one-line annotation "buildx failed with: Learn more at
      # https://docs.docker.com/go/build-cache-backends/", which is the last
      # line of exactly one error in the whole buildx source.
      #
      # This action's default driver is docker-container, where cache export is
      # unconditionally supported. `cache-from` was never the problem —
      # buildx only checks CacheTo against driver features.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and push
        id: push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Two things were wrong with how the later jobs named this image, and
      # each on its own was fatal.
      #
      # IMAGE_NAME is ${{ github.repository }} — `NickSanft/MisterFritz`.
      # metadata-action lowercases the names it PUSHES, so the registry holds
      # `ghcr.io/nicksanft/misterfritz`, but the smoke test and the canary
      # built their references by hand from IMAGE_NAME and asked for
      # `ghcr.io/NickSanft/MisterFritz`. An OCI repository name may not contain
      # uppercase at all, so that is not a tag that was missing — it is not
      # a parseable reference, and docker rejects it before contacting GHCR.
      #
      # And the tag they asked for could not exist either: `type=sha` defaults
      # to the SHORT sha (7 characters), while the step wrote the full 40 from
      # github.sha.
      #
      # A digest avoids both and is immutable, so the job that boots the image
      # and the job that deploys it get the same bytes rather than the same
      # moving tag.
      - name: Compose the reference the other jobs will use
        id: reference
        env:
          BASE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          lowercased="$(printf '%s' "$BASE" | tr '[:upper:]' '[:lower:]')"
          echo "image=${lowercased}@${DIGEST}" >> "$GITHUB_OUTPUT"

  # ── 2. Run full test suite against built image ─────────────────────────────
  test-image:
    name: Smoke-test image
    runs-on: ubuntu-latest
    needs: build
    # Pulls and runs; writes nothing. An explicit block sets every scope it
    # does not name to none, and a newly published GHCR package is private by
    # default — so without `packages: read` the pull is denied even though
    # this workflow is what pushed it. There is no checkout any more, so
    # `contents` is not needed at all.
    permissions:
      packages: read
    steps:
      # No checkout: everything this job runs comes from inside the image, and
      # the old one existed only because the step named a script by path.
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What this step used to be: `docker run <image> python
      # local-sim/mock_fritz.py`. An exec-form ENTRYPOINT APPENDS what docker
      # run is given rather than replacing it, so the real command was
      # `python main_discord.py python local-sim/mock_fritz.py` — and
      # main_discord read no arguments, so it booted the actual bot, failed
      # the Discord login on a placeholder token and exited. The curl five
      # seconds later could only ever fail. It also tested the mock's
      # lookalike /health and /metrics rather than the application's.
      #
      # `--preflight` is the real entrypoint, with everything a boot does
      # except connecting to Discord: the two modules a boot never reaches,
      # validate_config, the whole slash-command surface on a tree, the nltk
      # corpora the Dockerfile bakes, and the metrics server probed in-process
      # for /health, /metrics and a 404. See preflight.py.
      - name: Boot the image through its real entrypoint
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          docker run --rm \
            -e DISCORD_BOT_TOKEN=smoke-test-placeholder \
            -e ROOT_USER=discord-000000000000000000 \
            "$IMAGE" --preflight

      # .dockerignore excludes .env and config.json, so inside the image the
      # environment is the only source of configuration. With neither variable
      # set, validate_config MUST refuse to start. If this passes, something
      # baked a config.json into the image and every container is carrying
      # somebody's token.
      - name: The image carries no configuration of its own
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          if docker run --rm "$IMAGE" --preflight; then
            echo "::error::preflight passed with no DISCORD_BOT_TOKEN and no" \
                 "ROOT_USER, which means the image carries configuration of" \
                 "its own. Check .dockerignore."
            exit 1
          fi

  # ── 3. Canary deployment (requires self-hosted runner or manual trigger) ───
  # In real environments: update Argo Rollouts image tag, which triggers the
  # canary steps defined in infra/k8s/rollout.yaml automatically.
  canary-deploy:
    name: Trigger canary rollout
    runs-on: ubuntu-latest
    needs: [build, test-image]
    environment: production        # requires manual approval gate in GitHub
    # No checkout, no action, no GITHUB_TOKEN use at all — it talks to the
    # cluster with KUBECONFIG_B64. This is the job holding credentials, so it
    # is the one that should be able to do least with the repository.
    permissions: {}
    steps:
      - name: Update rollout image tag
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          # Was built by hand as REGISTRY/IMAGE_NAME:VERSION, and IMAGE_NAME is
          # ${{ github.repository }} — `NickSanft/MisterFritz`. An OCI
          # repository name may not contain uppercase, so kubectl was being
          # handed a string no registry can parse, while the image that was
          # actually pushed is `ghcr.io/nicksanft/misterfritz`. Now it deploys
          # the digest the smoke test booted, which is also what makes the
          # canary and the thing that passed the smoke test the same bytes.
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig

          echo "Setting rollout image to $IMAGE"
          kubectl argo rollouts set image misterfritz \
            misterfritz="$IMAGE" \
            -n misterfritz

          echo "Watching rollout (10% → analysis → 50% → analysis → 100%)..."
          kubectl argo rollouts status misterfritz -n misterfritz --timeout 10m

      - name: Post deployment summary
        if: always()
        env:
          # Same hand-built reference as above, with the same defect.
          IMAGE: ${{ needs.build.outputs.image }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          echo "## Deployment $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
