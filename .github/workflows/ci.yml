name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  # full-deps is expensive (torch, CUDA-free wheels, easyocr models) so it is
  # not on the push path — run it nightly and on demand.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# The default token for this repository is whatever the repository settings say,
# and this workflow runs code from the pull request head: `pip install -e` runs
# the PR's build backend and pytest imports its conftest. Neither needs to write
# anything, so neither may.
permissions:
  contents: read

# Actions are pinned to commit SHAs, with the version they were resolved from
# in the comment. A tag like `v4` is a moving pointer: whoever controls the
# action's repository can re-point it, and this workflow would run whatever it
# pointed at next — with the token below, and in release.yml with credentials.
# The cost is that these do not update themselves; bump them deliberately, or
# let a dependency bot propose it.
jobs:
  test:
    name: core + dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          # Was absent, so every run re-downloaded the whole closure.
          cache: pip
          # Both files, because the install below reads both. Keyed on
          # pyproject alone, editing the lock did not invalidate the cache.
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      # Core is deliberately torch-free — the GPU stack lives in the [image]
      # and [voice] extras, which this job does not install. See the
      # deferred imports in bot_commands / main_discord / agent_tools.
      #
      # `-c requirements.txt` is what makes this job test what ships. pyproject
      # declares FLOORS; requirements.txt is the pinned closure the Dockerfile
      # installs, and nothing installed it anywhere in CI. So the floors
      # resolved freely, and `unstructured>=0.18` resolved to 0.27.x — which
      # dropped nltk for spaCy in 0.21.0. Tests written about the shipped
      # closure then ran against a package family nobody ships, and went red
      # on a commit that touched neither file.
      #
      # The constraint has a solution: every declaration in pyproject is
      # admitted by its pin, which tests/test_packaging.py now checks from the
      # two files rather than hoping. The nightly full-deps job below stays
      # unconstrained on purpose — that is where floor drift is meant to
      # surface, nightly, blocking nothing.
      - name: Install core + dev, at the versions we ship
        run: pip install -c requirements.txt -e ".[dev]"

      - name: Compile all sources
        run: python -m compileall -q .

      - name: Lint with ruff
        run: ruff check .

      # Catches a dependency dropped from core that is still needed at import
      # time. pytest alone cannot: conftest.py stubs the heavy optional
      # modules, so a module can pass tests and still fail on a real boot.
      - name: Import smoke check
        run: python scripts/check_imports.py

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -v
        env:
          # Provide minimal config so validate_config() passes in any test
          # that triggers module-level initialisation
          DISCORD_BOT_TOKEN: "ci-placeholder-token"
          ROOT_USER: "discord-000000000000000000"
          OLLAMA_HOST: "http://127.0.0.1:11434"
          WHISPER_MODEL: "small"
          WHISPER_DEVICE: "cpu"
          WHISPER_COMPUTE_TYPE: "int8"
          # The image's own setting (Dockerfile), for the same reason and one
          # more. unstructured 0.18.21 calls nltk.download() at MODULE scope
          # unless this is false, and tests/test_packaging.py imports that
          # module to read it — so without this the suite would fetch two
          # corpora over the network on every run, quietly, inside a
          # `quiet=True` call that says nothing when it fails. Nothing here
          # parses a real .docx, so no corpus is needed.
          AUTO_DOWNLOAD_NLTK: "false"

  full-deps:
    name: all extras (CPU wheels)
    # Scheduled and manual only. Installing every extra pulls torch and
    # friends; on the push path that dominated the run and gave no signal the
    # core job does not already give.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # CPU wheels only. Without the extra index this pulls multi-GB CUDA
      # wheels that a GitHub runner has no GPU to use.
      - name: Install all extras
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -e ".[all]"

      # PyMuPDF provides `import fitz`. If a distribution named `fitz` ever
      # gets installed alongside it, whichever wheel lands last wins the
      # fitz/ directory — and if the wrong one wins, document_engine's
      # ImportError guard does not fire and fitz.open() raises AttributeError
      # inside PDF ingestion. Assert the good state explicitly.
      - name: Verify fitz resolves to PyMuPDF
        run: |
          python -c "import fitz; assert fitz.open, 'fitz.open missing'"
          python - <<'PY'
          import importlib.metadata as md
          try:
              v = md.version("fitz")
          except md.PackageNotFoundError:
              print("ok: no `fitz` distribution installed")
          else:
              raise SystemExit(f"FAIL: distribution `fitz` {v} is installed")
          PY

      - name: Run tests
        run: pytest tests/ --tb=short -q
        env:
          DISCORD_BOT_TOKEN: "ci-placeholder-token"
          ROOT_USER: "discord-000000000000000000"
          OLLAMA_HOST: "http://127.0.0.1:11434"
          WHISPER_MODEL: "small"
          WHISPER_DEVICE: "cpu"
          WHISPER_COMPUTE_TYPE: "int8"
