[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# This table is the intentional declaration of what MisterFritz depends on and
# why. requirements.txt remains the pinned production lock (DECISIONS #9: a
# hand-reviewed freeze, no pip-tools or uv), regenerated from this set.
#
# Before this existed, requirements.txt was a raw 292-line `pip freeze` that
# carried a 2016-era neuroimaging stack into every install, rooted in a single
# bogus `fitz==0.0.1.dev2` pin that fights PyMuPDF for ownership of the fitz/
# package directory. See the `ocr` extra below.
[project]
name = "misterfritz"
version = "0.0.0"          # the real version is fritz_utils.__version__
description = "Sardonic English-butler AI assistant for Discord, Telegram and the web"
requires-python = ">=3.12"

# Core = what is needed to import and run the non-optional surface: Discord,
# the LangGraph agent, Chroma memory, document RAG, and the admin/chat panel.
# Deliberately torch-free — every dependency that pulls torch lives in an extra.
dependencies = [
    # chat surfaces
    "discord.py>=2.6",
    "PyNaCl>=1.5",                 # discord voice channel support
    # agent / LLM stack
    "langchain>=1.1",
    "langchain-core>=1.2",
    "langchain-community>=0.4",
    "langchain-chroma>=1.1",
    "langchain-ollama>=1.0",
    "langchain-text-splitters>=1.1",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "chromadb>=1.3",
    "ollama>=0.6",
    "pydantic>=2.12",
    "typing_extensions>=4.15",
    # tools
    "httpx>=0.28",                 # plain client: no http2, no socks extras
    "beautifulsoup4>=4.14",
    "ddgs>=9.10",
    "pytz>=2025.2",
    "APScheduler>=3.10",
    # document ingestion — document_engine imports these at module level
    "watchdog>=6.0",
    "msoffcrypto-tool>=5.4",
    "openpyxl>=3.1",
    "unstructured>=0.18",
    "python-docx>=1.2",
    "pypdf>=6.4",
    # pandas is required by unstructured[xlsx], which UnstructuredExcelLoader
    # imports lazily. It is ALSO a nipype dep — do not remove it while purging
    # that chain, or .xlsx ingestion breaks silently at load time.
    "pandas>=2.0",
    # audio preprocessing. stt.py imports pydub at module level; the Whisper
    # model itself is deferred and lives in [voice].
    "pydub>=0.25",
    # admin panel + web chat
    "starlette>=0.46",
    "uvicorn>=0.38",               # plain Config: no reload, no websockets
    "python-multipart>=0.0.22",    # multipart form parsing for uploads
    "Jinja2>=3.1",
    "Markdown>=3.5",
    # SECURITY-CRITICAL, both of them. nh3 sanitises Fritz's rendered markdown;
    # python-markdown passes raw HTML through untouched, so dropping nh3
    # silently reopens stored XSS on the chat surface. Pygments backs
    # codehilite, and without it the highlight extension raises at render time.
    # Neither appears in any plan-era dependency list — they landed later.
    "nh3>=0.3,<0.4",
    "Pygments>=2.17",
    # Pillow is CORE, not an extra. admin_panel._sniff_image_format decodes an
    # upload to prove it really is an image rather than trusting the declared
    # Content-Type — that is the security control on chat image uploads. Without
    # Pillow it returns None for everything, so the endpoint 415s on every
    # upload: fails closed, but the feature is simply dead. Caught by running
    # the suite in a genuinely core-only venv, where four tests went red.
    "pillow>=12.0",
    # config + observability
    "python-dotenv>=1.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Coqui TTS (tts.py) and the Whisper STT model (stt.py). Pulls torch.
voice = ["coqui-tts>=0.27", "faster-whisper>=1.0"]
# SDXL image generation (image_generator.py). Pulls torch + CUDA wheels.
image = [
    "diffusers>=0.36",
    "torch>=2.9",
    "xformers>=0.0.33",
    "accelerate>=1.12",
    "safetensors>=0.7",
    "transformers>=4.57",
    "pillow>=12.0",
]
# Scanned-PDF OCR fallback (document_engine.py).
#
# PyMuPDF is what provides `import fitz`. There must NEVER be a separate `fitz`
# distribution: that is an unrelated 2016 neuroimaging package which claims the
# same fitz/ directory, and whichever wheel installs last wins. If it wins,
# `import fitz` succeeds — so document_engine's `except ImportError` guard does
# not fire — and `fitz.open()` then raises AttributeError inside PDF ingestion.
#
# Uninstalling it is also a trap: `fitz`'s RECORD lists fitz/__init__.py, so
# `pip uninstall fitz` DELETES PyMuPDF's shim. Force-reinstall PyMuPDF after.
# tests/test_packaging.py guards both halves of this.
ocr = ["easyocr>=1.7", "PyMuPDF>=1.26", "pillow>=12.0"]
telegram = ["python-telegram-bot>=20.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
all = [
    "misterfritz[voice]",
    "misterfritz[image]",
    "misterfritz[ocr]",
    "misterfritz[telegram]",
    "misterfritz[dev]",
]

# Flat layout: every module sits at the repo root, so auto-discovery refuses to
# guess and errors out. The list is explicit on purpose.
[tool.setuptools]
py-modules = [
    "admin_panel",
    "agent_tools",
    "bot_adapters",
    "bot_commands",
    "cards",
    "chat_auth",
    "document_engine",
    "file_tools",
    "fritz_utils",
    "identity_store",
    "image_generator",
    "main_discord",
    "main_telegram",
    "migrate_db",
    "migrate_identity",
    "mister_fritz",
    "observability",
    "prewarm",
    "privacy",
    "scheduler",
    "storage",
    "stt",
    "tts",
    "workspace_store",
]

[tool.ruff]
# Match the Python version we run on.
target-version = "py312"

# Don't lint third-party / generated / data directories.
extend-exclude = [
    ".venv",
    "venv",
    "chroma_store",
    "input",
    "output",
    "modelfiles",
    "infra",
    "local-sim",
    "skills",
]

# Long lines are a frequent cosmetic complaint that's not worth gating CI on
# for this codebase right now. Bump rather than ignore so the rule still
# nudges egregious cases.
line-length = 160

[tool.ruff.lint]
# E = pycodestyle errors (actual bugs and style errors)
# F = pyflakes (unused imports, undefined names, real bugs)
# W = pycodestyle warnings (whitespace etc.)
select = ["E", "F", "W"]

# E501 (line-too-long) is mostly cosmetic; line-length above handles the
# extreme cases. E701 (multiple statements on one line) is occasionally
# useful in dense control flow.
ignore = ["E501", "E701"]

[tool.ruff.lint.per-file-ignores]
# Test files re-import modules under test through sys.modules manipulation;
# unused-import warnings are noise there.
"tests/*" = ["F401"]

[tool.pytest.ini_options]
# Add the repo root to sys.path so test files can do `from mister_fritz import ...`
# without requiring `python -m pytest` (which auto-adds cwd). Plain `pytest` from
# the CI workflow now resolves the project modules the same way.
pythonpath = ["."]
testpaths = ["tests"]
