apiVersion: apps/v1
kind: Deployment
metadata:
  name: misterfritz
  namespace: misterfritz
  labels:
    app: misterfritz
spec:
  # Exactly one, and never autoscaled. Every replica would be a second Discord
  # login and a second brain on the one volume, and brain_lock refuses a
  # second brain on a memory store before it serves /metrics or /health: an
  # extra replica would only restart forever.
  replicas: 1
  # Recreate, not the default RollingUpdate. A rolling update starts the new
  # pod beside the old one on the same volume, and brain_lock makes a second
  # brain on one memory store refuse to start: the new pod would never become
  # ready, so the old one would never be stopped. Two brains on one store is
  # also exactly what the lock exists to prevent.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: misterfritz
  template:
    metadata:
      labels:
        app: misterfritz
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: misterfritz
          image: ghcr.io/OWNER/misterfritz:latest   # replace OWNER
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: misterfritz-config
            - secretRef:
                name: misterfritz-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            # Everything the bot writes that is not a document: the database,
            # the per-user workspaces and the audit log. See the configmap for
            # why this is not optional.
            - name: data
              mountPath: /app/data
              subPath: data
            - name: data
              mountPath: /app/input
              subPath: input
            - name: data
              mountPath: /app/output
              subPath: output
            - name: data
              mountPath: /app/chroma_store
              subPath: chroma_store
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: misterfritz-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: misterfritz-data
  namespace: misterfritz
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
