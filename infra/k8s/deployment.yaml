apiVersion: apps/v1
kind: Deployment
metadata:
  name: misterfritz
  namespace: misterfritz
  labels:
    app: misterfritz
spec:
  # NOTE: running multiple replicas of a Discord bot requires care —
  # only one replica should hold the gateway connection. For the metrics
  # and health endpoints, multiple replicas are fine.
  replicas: 1
  selector:
    matchLabels:
      app: misterfritz
  template:
    metadata:
      labels:
        app: misterfritz
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: misterfritz
          image: ghcr.io/OWNER/misterfritz:latest   # replace OWNER
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: misterfritz-config
            - secretRef:
                name: misterfritz-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /app/input
              subPath: input
            - name: data
              mountPath: /app/output
              subPath: output
            - name: data
              mountPath: /app/chroma_store
              subPath: chroma_store
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: misterfritz-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: misterfritz-data
  namespace: misterfritz
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
