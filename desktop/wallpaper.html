<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mister Fritz study scene</title>
    <style>
      /* Drawn behind the icons in place of the owner's wallpaper. The page
         has no background of its own: until its first frame, the webview's
         shows, which the shell sets to the owner's mood's --bg, so nothing
         of another colour (an unpainted canvas is black) is ever seen. No
         CSS animation or transition (scripts/check-paced.mjs), and no
         pointer handlers (scripts/check-no-input.mjs): the icons above take
         every click. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        user-select: none;
      }
      #backdrop {
        display: block;
        width: 100%;
        height: 100%;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <canvas id="backdrop"></canvas>
    <script type="module" src="/src/wallpaper/main.ts"></script>
  </body>
</html>
