## MisterFritz — Application Stack
#
# Ollama is NOT included here. Install Ollama natively on your host:
#   https://ollama.com/download
#
# Required models (run once after installing Ollama):
#   ollama create -f modelfiles/gpt-oss-20b-modelfile.txt gpt-oss
#   ollama create -f modelfiles/llama3.2-modelfile.txt llama3.2
#   ollama create -f modelfiles/llava-modelfile.txt llava
#   ollama pull mxbai-embed-large
#
# Copy .env.example → .env and fill in DISCORD_BOT_TOKEN and ROOT_USER
# before starting.

services:
  misterfritz:
    build: .
    env_file: .env
    environment:
      # host.docker.internal resolves to the host on Docker Desktop (Win/Mac).
      # On Linux add --add-host=host.docker.internal:host-gateway to docker run,
      # or set OLLAMA_HOST=http://172.17.0.1:11434 in your .env file.
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      # Everything the bot WRITES goes under /app/data, which is the one bind
      # mount below. Without these three the files landed on the container's
      # writable layer and `docker compose down`, a rebuild or any image update
      # destroyed them: the whole conversation history, every schedule, the
      # relay's messages AND its block list, and the identity aliases that keep
      # Fritz from greeting you as "discord-123456789".
      #
      # The relay blocks are the reason this is not merely annoying.
      # DECISIONS.md #22 deliberately keeps a block out of `/forget all`, so
      # that a privacy command can never become a safety regression - and a
      # container restart was doing exactly what that decision forbade, with no
      # command run and no audit line.
      #
      # DB_NAME alone covers CHAT_DB_NAME and SCHEDULE_DB, which default to it.
      - DB_NAME=/app/data/fritz.db
      - WORKSPACES_ROOT=/app/data/workspaces
      - AUDIT_LOG_PATH=/app/data/audit.log
    volumes:
      # input, output and chroma_store keep the paths they have always had, so
      # an existing deployment does not have to move anything. Only the state
      # that was never persisted is new, and it is a DIRECTORY bind: naming a
      # file that does not exist on the host makes Docker create a directory
      # there instead, which is how ./chat_history.db - a path nothing in this
      # codebase ever opens - became a directory on every first `up`.
      - ./data:/app/data
      - ./input:/app/input
      - ./output:/app/output
      - ./chroma_store:/app/chroma_store
    restart: unless-stopped
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v2.53.4
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  grafana_data:
