## MisterFritz — Application Stack
#
# Ollama is NOT included here. Install Ollama natively on your host:
#   https://ollama.com/download
#
# Required models (run once after installing Ollama):
#   ollama create -f modelfiles/gpt-oss-20b-modelfile.txt gpt-oss
#   ollama create -f modelfiles/llama3.2-modelfile.txt llama3.2
#   ollama create -f modelfiles/llava-modelfile.txt llava
#   ollama pull mxbai-embed-large
#
# Copy .env.example → .env and fill in DISCORD_BOT_TOKEN and ROOT_USER
# before starting.

services:
  misterfritz:
    build: .
    env_file: .env
    environment:
      # host.docker.internal resolves to the host on Docker Desktop (Win/Mac).
      # On Linux add --add-host=host.docker.internal:host-gateway to docker run,
      # or set OLLAMA_HOST=http://172.17.0.1:11434 in your .env file.
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./chroma_store:/app/chroma_store
      - ./chat_history.db:/app/chat_history.db
    restart: unless-stopped
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v2.53.4
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  grafana_data:
